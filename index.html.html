.stage{position:relative;z-index:1;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:88px 14px 28px}
.glass{width:100%;max-width:560px;background:var(--glass);border:1px solid var(--line);border-radius:30px;
 backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
 box-shadow:0 20px 60px rgba(20,0,0,.45),inset 0 1px 0 rgba(255,235,200,.25);padding:30px 24px 26px;position:relative}
.glass.wide{max-width:860px}
.logo{display:block;width:128px;height:128px;border-radius:50%;margin:-70px auto 14px;object-fit:cover;
 border:3px solid var(--gold);box-shadow:0 8px 28px rgba(0,0,0,.4);background:#fff}
.glass.wide .logo{width:96px;height:96px;margin-top:-62px}
h1{font-family:'Aref Ruqaa',serif;font-size:32px;text-align:center;margin:0;color:#fff3d6;letter-spacing:0}
.sub{text-align:center;margin:4px 0 22px;color:#f0dcb4;font-size:15px}
.view{display:none}.view.on{display:block}
/* search */
.search{position:relative}
.search input{width:100%;height:56px;border-radius:999px;border:2px solid transparent;background:rgba(255,250,240,.94);
 color:var(--ink);font:600 16px 'Cairo';padding:0 22px 0 64px}
.search input::placeholder{color:#9a7a6c;font-weight:400}
.search input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 4px rgba(212,169,80,.3)}
.search button{position:absolute;left:6px;top:6px;width:44px;height:44px;border-radius:50%;border:0;background:var(--red);color:#fff;cursor:pointer;display:grid;place-items:center}
.search button:hover{background:var(--red2)}
.add{display:block;margin:26px auto 4px;border:0;cursor:pointer;font:700 18px 'Cairo';color:var(--ink);
 background:linear-gradient(180deg,#efcb78,#c8993b);padding:15px 38px;border-radius:999px;box-shadow:0 8px 22px rgba(200,153,59,.4)}
.add:hover{filter:brightness(1.06)}
.hint{text-align:center;font-size:13px;color:#e6cfa0;margin-top:14px}
/* form */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.top h2{margin:0;font-size:21px;font-family:'Aref Ruqaa',serif;color:#fff3d6}
.back{background:transparent;border:1px solid var(--line);color:var(--cream);border-radius:999px;padding:10px 18px;min-height:42px;font:600 14px 'Cairo';cursor:pointer}
.back:hover{background:rgba(255,255,255,.12)}
.scroll{max-height:calc(100vh - 230px);max-height:calc(100dvh - 230px);overflow-y:auto;padding:2px 4px 8px;margin:0 -4px;scrollbar-width:thin;scrollbar-color:var(--gold) transparent}
fieldset{border:1px solid var(--line);border-radius:20px;margin:0 0 16px;padding:14px 16px 16px;background:rgba(40,6,10,.22)}
legend{padding:0 10px;font-weight:700;color:var(--gold);font-size:16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:#f3e2bd}
.f input,.f select,.f textarea{border:1.5px solid transparent;background:rgba(255,250,240,.93);color:var(--ink);border-radius:14px;padding:11px 14px;font:600 16px 'Cairo';width:100%;min-height:46px}
.f textarea{min-height:84px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,169,80,.3)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0}
.chip span{display:block;padding:10px 15px;border-radius:999px;border:1.5px solid var(--line);font-size:14px;cursor:pointer;background:rgba(255,255,255,.06)}
.chip input:checked+span{background:var(--gold);color:var(--ink);border-color:var(--gold);font-weight:700}
.chip input:focus-visible+span{outline:2px solid #fff;outline-offset:2px}
.up{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.upbtn{border:1.5px dashed var(--gold);color:#ffe7ae;border-radius:14px;padding:10px 16px;cursor:pointer;font:600 14px 'Cairo';background:rgba(255,255,255,.05)}
.upbtn:hover{background:rgba(212,169,80,.18)}
.fname{font-size:12px;color:#e6cfa0;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.save{width:100%;margin-top:6px;height:58px;border:0;border-radius:18px;font:700 19px 'Cairo';cursor:pointer;color:#fff;background:linear-gradient(180deg,var(--red2),var(--red));box-shadow:0 8px 22px rgba(122,15,31,.5);border:1px solid var(--gold)}
.save:hover{filter:brightness(1.1)}
/* profile */
.who{text-align:center;margin-bottom:16px}
.who h2{margin:0;font-size:26px;font-family:'Aref Ruqaa',serif;color:#fff3d6}
.badge{display:inline-block;margin-top:6px;padding:3px 14px;border-radius:999px;background:var(--gold);color:var(--ink);font-weight:700;font-size:13px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:20px;padding:14px 16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.card h3{margin:0 0 8px;font-size:15px;color:var(--gold)}
.row{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed rgba(236,200,130,.25);font-size:14px}
.row:last-child{border:0}.row b{color:#f0dcb4;font-weight:600;white-space:nowrap}.row span{text-align:left;min-width:0;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.tags i{font-style:normal;background:rgba(212,169,80,.22);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:13px}
.links a{display:block;color:#ffe7ae;padding:7px 0;text-decoration:none;font-size:14px;border-bottom:1px dashed rgba(236,200,130,.25)}
.links a:hover{text-decoration:underline}
.demo{background:rgba(212,169,80,.2);border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:12.5px;text-align:center;margin-bottom:12px}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(30px);background:var(--cream);color:var(--ink);padding:12px 22px;border-radius:999px;font-weight:700;opacity:0;transition:.3s;z-index:9;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.4)}
.toast.show{opacity:1;transform:translateX(-50%)}
@media(min-width:1024px){.glass.wide{max-width:1040px}.grid,.cards{grid-template-columns:repeat(3,1fr)}.glass{padding:34px 32px 30px}.scroll{max-height:calc(100dvh - 250px)}}
@media(max-width:640px){.grid,.cards{grid-template-columns:1fr}.glass{padding:26px 14px 20px;border-radius:24px}h1{font-size:28px}.logo{width:112px;height:112px;margin-top:-66px}.glass.wide .logo{width:84px;height:84px;margin-top:-56px}.stage{padding-top:78px}fieldset{padding:12px 12px 14px}.add{width:100%}.scroll{max-height:calc(100dvh - 215px)}}
@media(max-height:520px) and (orientation:landscape){.stage{padding-top:60px}.scroll{max-height:calc(100dvh - 160px)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const SERVICES=['شماس','كشافة','تربية كنيسة','خدمة أبونا بيشوي كامل','شنطة شهرية','مساعدة شهرية','لبس عيد','خدمات أخرى'];
const SERV2=[['cls','الفصل الحالي','text'],['skills','مهارات عند الابن','text'],['servant','الخادم المسئول','text'],['notes','ملاحظات خاصة','textarea',1]];
const FILES=[['idimg','صورة البطاقة'],['badge','صورة الكارنيه'],['medsimg','صور الأدوية / الروشتة']];

const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
function show(id){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id===id));window.scrollTo(0,0)}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2600)}

function field([k,l,type,full,opts]){
  const w=el('label','f'+(full?' full':''));w.append(el('span','',l));
  let i;
  if(type==='select'){i=el('select');(opts).forEach(o=>i.add(new Option(o,o)))}
  else if(type==='textarea'){i=el('textarea')}
  else{i=el('input');i.type=type;if(type==='tel')i.inputMode='tel'}
  i.name=k;w.append(i);return w;
}
function buildForm(){
  const b=$('#formBox');b.textContent='';
  const form=el('form');form.noValidate=true;
  SECTIONS.forEach(s=>{const fs=el('fieldset');fs.append(el('legend','',s.t));const g=el('div','grid');s.f.forEach(f=>g.append(field(f)));fs.append(g);form.append(fs)});
  const fs=el('fieldset');fs.append(el('legend','','بيانات الخدمة'));
  const ch=el('div','chips full');
  SERVICES.forEach(s=>{const c=el('label','chip');const i=el('input');i.type='checkbox';i.name='svc';i.value=s;c.append(i,el('span','',s));ch.append(c)});
  const g=el('div','grid');g.append(ch);SERV2.forEach(f=>g.append(field(f)));fs.append(g);form.append(fs);
  const fa=el('fieldset');fa.append(el('legend','','المرفقات'));const ga=el('div','grid');
  FILES.forEach(([k,l])=>{const w=el('div','up full');const i=el('input');i.type='file';i.accept='image/*';i.hidden=true;i.name=k;if(k==='medsimg')i.multiple=true;
    const bt=el('button','upbtn','رفع '+l);bt.type='button';const n=el('span','fname','لم يتم اختيار ملف');
    bt.onclick=()=>i.click();i.onchange=()=>{n.textContent=[...i.files].map(f=>f.name).join('، ')||'لم يتم اختيار ملف'};
    w.append(bt,n,i);ga.append(w)});
  fa.append(ga);form.append(fa);
  const sv=el('button','save','حفظ البيانات');sv.type='submit';form.append(sv);
  form.onsubmit=async e=>{e.preventDefault();
    const d=Object.fromEntries(new FormData(form));FILES.forEach(([k])=>delete d[k]);
    d.svc=[...form.querySelectorAll('[name=svc]:checked')].map(x=>x.value);
    if(!d.name||!d.name.trim()){toast('اكتب الاسم الرباعي الأول');return}
    sv.disabled=true;sv.textContent='جاري الحفظ...';
    try{
      let code;
      if(CONFIGURED){
        d.files={};const E=form.elements;
        if(E.idimg.files[0])d.files.idimg=await compress(E.idimg.files[0]);
        if(E.badge.files[0])d.files.badge=await compress(E.badge.files[0]);
        d.files.medsimg=(await Promise.all([...E.medsimg.files].map(compress))).filter(Boolean);
        const r=await apiPost(d);if(!r.ok)throw new Error(r.error||'فشل الحفظ');code=r.code;
      }else{code='BRK-'+String(DB.length+1).padStart(4,'0');d.code=code;DB.push(d)}
      toast('تم الحفظ — الكود: '+code);form.reset();
      form.querySelectorAll('.fname').forEach(n=>n.textContent='لم يتم اختيار ملف');show('v-home');
    }catch(err){toast(err.message||'حصلت مشكلة، جرّب تاني')}
    finally{sv.disabled=false;sv.textContent='حفظ البيانات'}
  };
  b.append(form);
}

const LAB={name:'الاسم',age:'السن',phone:'التليفون',address:'العنوان',birth:'تاريخ الميلاد',nid:'الرقم القومي',qual:'المؤهل',stage:'المرحلة',job:'الوظيفة',marital:'الحالة الاجتماعية',father:'اسم الأب',fjob:'وظيفة الأب',mother:'اسم الأم',mjob:'وظيفة الأم',bro:'الإخوة الذكور',sis:'الأخوات الإناث',guard:'ولي الأمر',gmob:'موبايل ولي الأمر',dis:'الإعاقة',meds:'الأدوية',card:'بطاقة الخدمات المتكاملة',cls:'الفصل الحالي',skills:'المهارات',servant:'الخادم المسئول',notes:'ملاحظات'};
function card(title,keys,d){const c=el('div','card');c.append(el('h3','',title));keys.forEach(k=>{const r=el('div','row');r.append(el('b','',LAB[k]),el('span','',d[k]||'—'));c.append(r)});return c}
function profile(d,isSample){
  const b=$('#profBox');b.textContent='';
  if(isSample)b.append(el('div','demo','دي بيانات تجريبية بس عشان تشوف شكل الصفحة'));
  const w=el('div','who');w.append(el('h2','',d.name),el('span','badge',d.code));b.append(w);
  const g=el('div','cards');
  g.append(card('البيانات الشخصية',['age','phone','address','birth','nid','qual','stage','job','marital'],d));
  g.append(card('البيانات العائلية',['father','fjob','mother','mjob','bro','sis','guard','gmob'],d));
  g.append(card('الحالة الصحية',['dis','meds','card'],d));
  const sc=el('div','card');sc.append(el('h3','','بيانات الخدمة'));const t=el('div','tags');(d.svc||[]).forEach(s=>t.append(el('i','',s)));sc.append(t);
  ['cls','skills','servant','notes'].forEach(k=>{const r=el('div','row');r.append(el('b','',LAB[k]),el('span','',d[k]||'—'));sc.append(r)});g.append(sc);
  const at=el('div','card links');at.append(el('h3','','المرفقات'));
  const okUrl=u=>/^https:\/\/(drive|docs)\.google\.com\//.test(u);
  const items=isSample?[['صورة البطاقة','#'],['صورة الكارنيه','#'],['صور الأدوية / الروشتة','#']]
    :[['صورة البطاقة',d.idimg],['صورة الكارنيه',d.badge]].concat((d.medsimg||'').split('\n').filter(Boolean).map((u,i,a)=>['صورة الدواء / الروشتة'+(a.length>1?' '+(i+1):''),u]));
  items.forEach(([l,u])=>{
    if(!u||(!isSample&&!okUrl(u))){const s=el('span','',l+': غير مرفقة');s.style.cssText='display:block;padding:7px 0;color:#d9c08a;font-size:14px';at.append(s);return}
    const a=el('a','',l+' ↗');a.href=u;a.target='_blank';a.rel='noopener';
    if(isSample)a.onclick=e=>{e.preventDefault();toast('هنا هيفتح رابط الصورة من Google Drive')};at.append(a)});
  at.classList.add('full');at.style.gridColumn='1/-1';g.append(at);b.append(g);show('v-profile');
}
function compress(file){return new Promise(res=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const s=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    URL.revokeObjectURL(u);res({name:file.name.replace(/\.[^.]+$/,'')+'.jpg',mime:'image/jpeg',base64:c.toDataURL('image/jpeg',.72).split(',')[1]})};
  img.onerror=()=>res(null);img.src=u})}
async function apiGet(q){const r=await fetch(SCRIPT_URL+'?action=search&q='+encodeURIComponent(q));return r.json()}
async function apiPost(data){const r=await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify({action:'add',data})});return r.json()}
async function search(){
  const q=$('#q').value.trim();if(!q){toast('اكتب الكود أو الرقم القومي');$('#q').focus();return}
  if(!CONFIGURED){const f=DB.find(x=>x.code===q.toUpperCase()||x.nid===q);f?profile(f,false):profile(SAMPLE,true);return}
  const go=$('#go');go.disabled=true;
  try{const r=await apiGet(q);
    if(r.ok){const d=r.data;d.svc=(d.svc||'').split('،').map(s=>s.trim()).filter(Boolean);profile(d,false)}
    else toast(r.error||'مفيش نتيجة')}
  catch(e){toast('تعذّر الاتصال، اتأكد من الإنترنت')}
  finally{go.disabled=false}
}
if(CONFIGURED)$('#hint').remove();
$('#go').onclick=search;$('#q').onkeydown=e=>{if(e.key==='Enter')search()};
$('#addBtn').onclick=()=>{buildForm();show('v-form')};
document.querySelectorAll('[data-home]').forEach(b=>b.onclick=()=>show('v-home'));
</script>
